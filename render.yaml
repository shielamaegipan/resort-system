services:
  - type: pserv
    name: resort-mysql
    runtime: docker
    region: singapore
    plan: 1c-2g
    dockerfilePath: ./deploy/mysql/Dockerfile
    dockerContext: .
    disk:
      name: resort-database
      mountPath: /var/lib/mysql
      sizeGB: 10
    envVars:
      - key: MYSQL_DATABASE
        value: resort_system
      - key: MYSQL_USER
        value: resort
      - key: MYSQL_PASSWORD
        generateValue: true
      - key: MYSQL_ROOT_PASSWORD
        generateValue: true

  - type: web
    name: resort-system
    runtime: docker
    region: singapore
    plan: 0.5c-512mb
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    disk:
      name: resort-uploads
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: STORAGE_DIR
        value: /data
      - key: SEED_DEMO
        value: "false"
      - key: JWT_SECRET
        generateValue: true
      - key: DB_HOST
        fromService:
          type: pserv
          name: resort-mysql
          property: host
      - key: DB_PORT
        value: "3306"
      - key: DB_NAME
        fromService:
          type: pserv
          name: resort-mysql
          envVarKey: MYSQL_DATABASE
      - key: DB_USER
        fromService:
          type: pserv
          name: resort-mysql
          envVarKey: MYSQL_USER
      - key: DB_PASSWORD
        fromService:
          type: pserv
          name: resort-mysql
          envVarKey: MYSQL_PASSWORD
